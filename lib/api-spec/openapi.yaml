openapi: 3.1.0
info:
  title: Api
  version: 0.4.0
  description: Wordbox API - English vocabulary learning platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: words
    description: Vocabulary word operations
  - name: progress
    description: User progress tracking
  - name: games
    description: Game sessions and scores
  - name: stats
    description: Learning statistics
  - name: achievements
    description: Achievement and badge operations
  - name: challenges
    description: Daily, weekly, monthly challenges
  - name: leaderboard
    description: Leaderboard rankings
  - name: profile
    description: User profile management
  - name: admin
    description: Admin panel operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "409":
          description: Phone already registered

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with phone and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out and destroy session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Code sent (or ignored if phone not found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResult"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean

  /profile:
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update display name and daily goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileUpdateResult"

  /profile/password:
    patch:
      operationId: changePassword
      tags: [profile]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          description: Current password incorrect

  /words:
    get:
      operationId: listWords
      tags: [words]
      summary: List vocabulary words with progress
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [A1, A2, B1, B2, C1, C2]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: favoritesOnly
          in: query
          schema:
            type: boolean
        - name: learnedOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of words
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordListResponse"

  /words/{wordId}:
    get:
      operationId: getWord
      tags: [words]
      summary: Get a single word by ID
      parameters:
        - name: wordId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Word details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordWithProgress"
        "404":
          description: Word not found

  /words/{wordId}/progress:
    post:
      operationId: markWordProgress
      tags: [progress]
      summary: Record a practice result for a word
      parameters:
        - name: wordId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressInput"
      responses:
        "200":
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordProgress"

  /words/due:
    get:
      operationId: getDueWords
      tags: [words]
      summary: Get words due for spaced repetition review today
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Words due for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueWordsResponse"

  /words/{wordId}/favorite:
    post:
      operationId: toggleFavorite
      tags: [words]
      summary: Toggle favorite status for a word
      parameters:
        - name: wordId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated favorite status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteToggleResult"

  /progress:
    get:
      operationId: getUserProgress
      tags: [progress]
      summary: Get all word progress for the current user
      responses:
        "200":
          description: User word progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WordProgress"

  /games/sessions:
    get:
      operationId: getGameSessions
      tags: [games]
      summary: Get recent game sessions for the current user
      responses:
        "200":
          description: List of game sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameSession"
    post:
      operationId: createGameSession
      tags: [games]
      summary: Save a completed game session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSessionInput"
      responses:
        "201":
          description: Session saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"

  /games/daily-challenge:
    get:
      operationId: getDailyChallengeGame
      tags: [games]
      summary: Get today's daily challenge questions
      responses:
        "200":
          description: Daily challenge data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyChallengeResponse"

  /games/quiz:
    get:
      operationId: getQuizWords
      tags: [games]
      summary: Get quiz questions
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [A1, A2, B1, B2, C1, C2]
        - name: count
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Quiz questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizQuestion"

  /games/crossword:
    get:
      operationId: getCrosswordPuzzle
      tags: [games]
      summary: Get a crossword puzzle
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [A1, A2, B1, B2, C1, C2]
      responses:
        "200":
          description: Crossword puzzle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrosswordPuzzle"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get a summary of the user's learning statistics
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/activity:
    get:
      operationId: getActivityHistory
      tags: [stats]
      summary: Get daily activity counts for the last 52 weeks
      responses:
        "200":
          description: Array of daily activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityDay"

  /stats/levels:
    get:
      operationId: getLevelStats
      tags: [stats]
      summary: Get per-CEFR-level progress
      responses:
        "200":
          description: Level-by-level stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LevelStat"

  /achievements:
    get:
      operationId: getUserAchievements
      tags: [achievements]
      summary: Get the current user's unlocked achievements
      responses:
        "200":
          description: Unlocked achievements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Achievement"

  /achievements/all:
    get:
      operationId: getAllAchievements
      tags: [achievements]
      summary: Get all achievements with locked/unlocked status
      responses:
        "200":
          description: All achievements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AchievementFull"

  /challenges/daily:
    get:
      operationId: getDailyChallenge
      tags: [challenges]
      summary: Get the daily challenge progress
      responses:
        "200":
          description: Daily challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeProgress"

  /challenges/weekly:
    get:
      operationId: getWeeklyChallenge
      tags: [challenges]
      summary: Get the weekly challenge progress
      responses:
        "200":
          description: Weekly challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeProgress"

  /challenges/monthly:
    get:
      operationId: getMonthlyChallenge
      tags: [challenges]
      summary: Get the monthly challenge progress
      responses:
        "200":
          description: Monthly challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeProgress"

  /challenges/{challengeId}/complete:
    post:
      operationId: completeChallenge
      tags: [challenges]
      summary: Claim the reward for a completed challenge
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            enum: [daily, weekly, monthly]
      responses:
        "200":
          description: Reward claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeCompletionResult"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top 20 users by XP
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /daily-reward:
    post:
      operationId: claimDailyReward
      tags: [profile]
      summary: Claim daily login reward (once per day)
      responses:
        "200":
          description: Reward result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRewardResult"

  /daily-reward/status:
    get:
      operationId: getDailyRewardStatus
      tags: [profile]
      summary: Check if today's reward has been claimed
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyRewardStatusResult"

  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "403":
          description: Admin required

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"

  /admin/users/{id}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
    put:
      operationId: updateAdminUser
      tags: [admin]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateUserInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean

  /admin/users/{id}/ban:
    post:
      operationId: banAdminUser
      tags: [admin]
      summary: Toggle ban status for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ban toggled
          content:
            application/json:
              schema:
                type: object
                required: [id, isBanned]
                properties:
                  id:
                    type: integer
                  isBanned:
                    type: boolean

  /admin/users/{id}/reset-progress:
    post:
      operationId: resetAdminUserProgress
      tags: [admin]
      summary: Reset all word progress and game sessions for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Progress reset
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean

  /admin/users/{id}/grant-premium:
    post:
      operationId: grantAdminUserPremium
      tags: [admin]
      summary: Set subscription tier for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminGrantPremiumInput"
      responses:
        "200":
          description: Tier updated
          content:
            application/json:
              schema:
                type: object
                required: [id, subscriptionTier]
                properties:
                  id:
                    type: integer
                  subscriptionTier:
                    type: string

  /admin/analytics:
    get:
      operationId: getAdminAnalytics
      tags: [admin]
      summary: Get platform analytics
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAnalytics"

  /admin/words:
    get:
      operationId: listAdminWords
      tags: [admin]
      summary: List all words (admin, paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
        - name: search
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [A1, A2, B1, B2, C1, C2]
      responses:
        "200":
          description: Word list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWordListResponse"

  /admin/words/{id}:
    put:
      operationId: updateAdminWord
      tags: [admin]
      summary: Update a word
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateWordInput"
      responses:
        "200":
          description: Updated word
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Word"

  /admin/words/export-csv:
    get:
      operationId: exportAdminWordsCsv
      tags: [admin]
      summary: Export all words as CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /admin/words/import-csv:
    post:
      operationId: importAdminWordsCsv
      tags: [admin]
      summary: Import words from CSV
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCsvImportResult"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    AuthUser:
      type: object
      required: [id, phone, fullName, isAdmin, subscriptionTier]
      properties:
        id:
          type: integer
        phone:
          type: string
        fullName:
          type: string
        isAdmin:
          type: boolean
        subscriptionTier:
          type: string
          enum: [free, premium, pro]

    RegisterInput:
      type: object
      required: [phone, fullName, password]
      properties:
        phone:
          type: string
        fullName:
          type: string
        password:
          type: string

    LoginInput:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean

    ForgotPasswordInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string

    ForgotPasswordResult:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
        code:
          type: ["string", "null"]
          description: Dev mode only — the 6-digit reset code

    ResetPasswordInput:
      type: object
      required: [phone, code, newPassword]
      properties:
        phone:
          type: string
        code:
          type: string
        newPassword:
          type: string

    UpdateProfileInput:
      type: object
      properties:
        fullName:
          type: string
        dailyGoalTarget:
          type: integer
          enum: [10, 20, 30, 50]

    ProfileUpdateResult:
      type: object
      required: [id, fullName, dailyGoalTarget]
      properties:
        id:
          type: integer
        fullName:
          type: string
        dailyGoalTarget:
          type: integer

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string

    Word:
      type: object
      required: [id, word, translation, level, category]
      properties:
        id:
          type: integer
        word:
          type: string
        translation:
          type: string
          description: Uzbek translation
        level:
          type: string
          enum: [A1, A2, B1, B2, C1, C2]
        category:
          type: string
        partOfSpeech:
          type: ["string", "null"]
        exampleSentence:
          type: ["string", "null"]
        exampleTranslation:
          type: ["string", "null"]
        phonetic:
          type: ["string", "null"]

    WordWithProgress:
      allOf:
        - $ref: "#/components/schemas/Word"
        - type: object
          properties:
            learned:
              type: boolean
            practiceCount:
              type: integer
            score:
              type: integer
            isFavorite:
              type: boolean

    WordListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WordWithProgress"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    WordProgress:
      type: object
      required: [wordId, learned, practiceCount, score, isFavorite]
      properties:
        wordId:
          type: integer
        learned:
          type: boolean
        practiceCount:
          type: integer
        score:
          type: integer
          description: 0-100 mastery score
        isFavorite:
          type: boolean
        nextReviewAt:
          type: ["string", "null"]
          description: ISO timestamp when this word is next due for spaced repetition review

    DueWordsResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WordWithProgress"
        total:
          type: integer

    ProgressInput:
      type: object
      required: [correct]
      properties:
        correct:
          type: boolean
        gameType:
          type: ["string", "null"]

    FavoriteToggleResult:
      type: object
      required: [wordId, isFavorite]
      properties:
        wordId:
          type: integer
        isFavorite:
          type: boolean

    GameSession:
      type: object
      required: [id, gameType, level, score, totalQuestions, correctAnswers, coinsEarned, createdAt]
      properties:
        id:
          type: integer
        gameType:
          type: string
          enum: [quiz, crossword, flashcard, matching, spelling, daily_challenge, anagram, speed_quiz]
        level:
          type: string
          enum: [A1, A2, B1, B2, C1, C2]
        score:
          type: integer
        totalQuestions:
          type: integer
        correctAnswers:
          type: integer
        coinsEarned:
          type: integer
        createdAt:
          type: string

    GameSessionInput:
      type: object
      required: [gameType, level, score, totalQuestions, correctAnswers]
      properties:
        gameType:
          type: string
          enum: [quiz, crossword, flashcard, matching, spelling, daily_challenge, anagram, speed_quiz]
        level:
          type: string
          enum: [A1, A2, B1, B2, C1, C2]
        score:
          type: integer
        totalQuestions:
          type: integer
        correctAnswers:
          type: integer
        durationSeconds:
          type: integer
          description: How long the session took in seconds
        coinsEarned:
          type: ["integer", "null"]

    DailyChallengeResponse:
      type: object
      required: [questions, completedToday, bonusCoins]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
        completedToday:
          type: boolean
        bonusCoins:
          type: integer

    CrosswordClue:
      type: object
