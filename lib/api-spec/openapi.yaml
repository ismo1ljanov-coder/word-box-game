openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Wordbox API - English vocabulary learning platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: words
    description: Vocabulary word operations
  - name: progress
    description: User progress tracking
  - name: games
    description: Game sessions and scores
  - name: stats
    description: Learning statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /words:
    get:
      operationId: listWords
      tags: [words]
      summary: List vocabulary words, optionally filtered by level
      parameters:
        - name: level
          in: query
          schema:
            type: ["string", "null"]
            enum: [A1, A2, B1, B2, C1, C2, null]
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: pageSize
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of words
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordListResponse"

  /words/favorites:
    get:
      operationId: getFavoriteWords
      tags: [words]
      summary: Get all favorited words
      responses:
        "200":
          description: List of favorite words
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WordWithProgress"

  /words/{id}:
    get:
      operationId: getWord
      tags: [words]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Word detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordWithProgress"
        "404":
          description: Not found

  /words/{id}/progress:
    post:
      operationId: markWordProgress
      tags: [progress]
      summary: Record that user learned or practiced a word
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressInput"
      responses:
        "200":
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordProgress"

  /words/{id}/favorite:
    post:
      operationId: toggleFavorite
      tags: [words]
      summary: Toggle favorite status of a word
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated favorite status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToggleFavoriteResponse"

  /progress:
    get:
      operationId: listProgress
      tags: [progress]
      summary: Get all word progress for the user
      responses:
        "200":
          description: Progress list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WordProgress"

  /games/sessions:
    get:
      operationId: listGameSessions
      tags: [games]
      summary: Get recent game sessions
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameSession"
    post:
      operationId: createGameSession
      tags: [games]
      summary: Save a completed game session score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameSessionInput"
      responses:
        "201":
          description: Session saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"

  /games/crossword:
    get:
      operationId: getCrosswordPuzzle
      tags: [games]
      summary: Generate a crossword puzzle for a given level
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [A1, A2, B1, B2, C1, C2]
      responses:
        "200":
          description: Crossword puzzle data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrosswordPuzzle"

  /games/quiz:
    get:
      operationId: getQuizWords
      tags: [games]
      summary: Get words for a quiz session
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [A1, A2, B1, B2, C1, C2]
        - name: count
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Quiz words with distractors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizQuestion"

  /games/daily-challenge:
    get:
      operationId: getDailyChallenge
      tags: [games]
      summary: Get today's daily challenge words
      responses:
        "200":
          description: Daily challenge data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyChallengeResponse"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get learning summary stats
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/levels:
    get:
      operationId: getLevelStats
      tags: [stats]
      summary: Get progress breakdown by level
      responses:
        "200":
          description: Level breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LevelStat"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Word:
      type: object
      required: [id, word, translation, level, category]
      properties:
        id:
          type: integer
        word:
          type: string
        translation:
          type: string
          description: Uzbek translation
        level:
          type: string
          enum: [A1, A2, B1, B2, C1, C2]
        category:
          type: string
        partOfSpeech:
          type: ["string", "null"]
        exampleSentence:
          type: ["string", "null"]
        exampleTranslation:
          type: ["string", "null"]
        phonetic:
          type: ["string", "null"]

    WordWithProgress:
      allOf:
        - $ref: "#/components/schemas/Word"
        - type: object
          properties:
            learned:
              type: boolean
            practiceCount:
              type: integer
            score:
              type: integer
            isFavorite:
              type: boolean

    WordListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WordWithProgress"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    WordProgress:
      type: object
      required: [wordId, learned, practiceCount, score, isFavorite]
      properties:
        wordId:
          type: integer
        learned:
          type: boolean
        practiceCount:
          type: integer
        score:
          type: integer
          description: 0-100 mastery score
        isFavorite:
          type: boolean

    ProgressInput:
      type: object
      required: [correct]
      properties:
        correct:
          type: boolean
        gameType:
          type: ["string", "null"]

    ToggleFavoriteResponse:
      type: object
      required: [wordId, isFavorite]
      properties:
        wordId:
          type: integer
        isFavorite:
          type: boolean

    GameSession:
      type: object
      required: [id, gameType, level, score, totalQuestions, correctAnswers, coinsEarned, createdAt]
      properties:
        id:
          type: integer
        gameType:
          type: string
          enum: [quiz, crossword, flashcard, matching, spelling, daily_challenge]
        level:
          type: string
          enum: [A1, A2, B1, B2, C1, C2]
        score:
          type: integer
        totalQuestions:
          type: integer
        correctAnswers:
          type: integer
        coinsEarned:
          type: integer
        createdAt:
          type: string

    GameSessionInput:
      type: object
      required: [gameType, level, score, totalQuestions, correctAnswers]
      properties:
        gameType:
          type: string
          enum: [quiz, crossword, flashcard, matching, spelling, daily_challenge]
        level:
          type: string
          enum: [A1, A2, B1, B2, C1, C2]
        score:
          type: integer
        totalQuestions:
          type: integer
        correctAnswers:
          type: integer
        coinsEarned:
          type: ["integer", "null"]

    DailyChallengeResponse:
      type: object
      required: [questions, completedToday, bonusCoins]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuizQuestion"
        completedToday:
          type: boolean
        bonusCoins:
          type: integer

    CrosswordClue:
      type: object
      required: [number, direction, clue, answer, row, col, length]
      properties:
        number:
          type: integer
        direction:
          type: string
          enum: [across, down]
        clue:
          type: string
          description: Uzbek translation as clue
        answer:
          type: string
          description: English word as answer
        row:
          type: integer
        col:
          type: integer
        length:
          type: integer

    CrosswordPuzzle:
      type: object
      required: [grid, clues, level]
      properties:
        grid:
          type: array
          items:
            type: array
            items:
              type: ["string", "null"]
        clues:
          type: array
          items:
            $ref: "#/components/schemas/CrosswordClue"
        level:
          type: string

    QuizQuestion:
      type: object
      required: [wordId, word, correctAnswer, options]
      properties:
        wordId:
          type: integer
        word:
          type: string
          description: English word to translate
        correctAnswer:
          type: string
          description: Correct Uzbek translation
        options:
          type: array
          items:
            type: string
          description: 4 options including correct answer

    StatsSummary:
      type: object
      required: [totalWords, learnedWords, totalSessions, averageScore, streakDays, totalXp, totalCoins, dailyGoalTarget, dailyGoalCompleted, weeklyXp, favoriteWords]
      properties:
        totalWords:
          type: integer
        learnedWords:
          type: integer
        totalSessions:
          type: integer
        averageScore:
          type: integer
        streakDays:
          type: integer
        totalXp:
          type: integer
        totalCoins:
          type: integer
        dailyGoalTarget:
          type: integer
        dailyGoalCompleted:
          type: integer
        weeklyXp:
          type: integer
        favoriteWords:
          type: integer

    LevelStat:
      type: object
      required: [level, totalWords, learnedWords, percentage]
      properties:
        level:
          type: string
        totalWords:
          type: integer
        learnedWords:
          type: integer
        percentage:
          type: integer
