kind = "mobile"
previewPath = "/mobile/"
title = "Wordbox Mobile"
version = "1.0.0"
id = "artifacts/wordbox-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 19065

[services.development]
run = "pnpm --filter @workspace/wordbox-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wordbox-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/wordbox-mobile", "run", "serve" ]

[services.env]
PORT = "19065"
BASE_PATH = "/mobile/"
