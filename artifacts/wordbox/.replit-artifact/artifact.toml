kind = "web"
previewPath = "/"
title = "Wordbox"
version = "1.0.0"
id = "artifacts/wordbox"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25633

[services.development]
run = "pnpm --filter @workspace/wordbox run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wordbox", "run", "build" ]
publicDir = "artifacts/wordbox/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25633"
BASE_PATH = "/"
